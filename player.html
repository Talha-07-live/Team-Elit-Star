<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#08070c" />
<meta name="color-scheme" content="dark" />
<title>Photo &amp; Video Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root{color-scheme:dark;--bg:#08070c;--panel:#14131a;--panel2:#1b1a22;--panel3:#24212b;--red:#d8ad55;--red2:#fce7b8;--gold:#e8c36b;--gold-bright:#fce7b8;--gold-line:rgba(232,195,107,.45);--text:#ede7d6;--muted:#a7a1b0;--line:rgba(232,195,107,.19);--line-red:rgba(232,195,107,.45);--sans:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--display:"Space Grotesk",Inter,sans-serif;--serif:"Cormorant Garamond",Georgia,serif;--radius:16px;--fit:contain}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg);scroll-behavior:smooth}body{min-height:100%;margin:0;padding:clamp(8px,2vw,22px);background:radial-gradient(900px 460px at 8% -8%,rgba(232,195,107,.13),transparent 64%),radial-gradient(700px 420px at 100% 10%,rgba(112,76,133,.09),transparent 65%),linear-gradient(160deg,#17131d 0,#08070c 52%,#050407 100%);color:var(--text);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{touch-action:manipulation}.player-app{width:min(1480px,100%);margin:0 auto;overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:20px;background:linear-gradient(145deg,rgba(27,26,34,.98),rgba(8,7,12,.99));box-shadow:0 30px 100px -55px #000,0 0 70px -50px rgba(232,195,107,.32)}
.player-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px clamp(14px,2.2vw,26px);border-bottom:1px solid var(--line);background:rgba(8,7,12,.72)}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand-mark{display:grid;place-items:center;flex:0 0 42px;width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,var(--gold-bright),#a40009);box-shadow:0 7px 25px -12px var(--gold);color:#fff;font-size:1.12rem}.brand-copy{min-width:0}.brand strong{display:block;font:700 .9rem var(--display);letter-spacing:.095em;text-transform:uppercase}.brand small{display:block;margin-top:3px;color:var(--muted);font-size:.71rem}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:37px;padding:8px 12px;border:1px solid rgba(255,255,255,.13);border-radius:8px;background:rgba(255,255,255,.045);color:var(--text);font:700 .67rem var(--display);letter-spacing:.035em;cursor:pointer;transition:background .18s ease,border-color .18s ease,transform .18s ease;white-space:nowrap}.btn:hover{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.1);transform:translateY(-1px)}.btn:active{transform:translateY(0)}.btn.primary{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#fff;box-shadow:0 6px 18px -13px var(--gold)}.btn.primary:hover{background:linear-gradient(180deg,#ff3943,#c9000b)}.btn.active{border-color:var(--gold-line);background:rgba(232,195,107,.13);color:#fce7b8}.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}.btn svg{width:15px;height:15px;flex:0 0 auto}
.player-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(275px,.72fr);min-width:0}.stage{min-width:0;padding:clamp(12px,2vw,25px)}.section-eyebrow{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:#f1d9d9;font:700 .62rem var(--display);letter-spacing:.17em;text-transform:uppercase}.live-dot{width:7px;height:7px;border-radius:50%;background:var(--gold-bright);box-shadow:0 0 12px rgba(232,195,107,.9)}.media-shell{position:relative;width:100%;aspect-ratio:16/9;max-height: min(74svh,820px);overflow:hidden;border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);background:#050409;isolation:isolate;box-shadow:0 22px 65px -35px #000,0 0 0 1px rgba(255,255,255,.015)}.media-shell iframe,.media-shell video,.media-shell>img{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;background:#050409}.media-shell video,.media-shell>img{object-fit:var(--fit);object-position:center}.media-shell iframe{overflow:hidden}.media-shell [hidden]{display:none!important}.empty{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding:clamp(16px,4vw,34px);text-align:center;background:radial-gradient(ellipse at 50% 35%,rgba(232,195,107,.21),transparent 45%),linear-gradient(140deg,#1d191f,#08070c 70%)}.empty-inner{max-width:370px}.empty-icon{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 16px;border:1px solid rgba(255,255,255,.17);border-radius:19px;background:linear-gradient(145deg,var(--gold),#720009);box-shadow:0 12px 40px -17px var(--gold);font-size:1.4rem}.empty h1{margin:0;font:700 clamp(1.45rem,3vw,2.3rem)/1.1 var(--display);letter-spacing:-.045em}.empty p{margin:11px 0 0;color:#b9b4bd;font-size:.81rem;line-height:1.7}.media-shade{position:absolute;inset:auto 0 0;z-index:2;height:24%;pointer-events:none;background:linear-gradient(0deg,rgba(0,0,0,.28),transparent)}.empty[hidden]~.media-shade{display:none}
.now-playing{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:17px 2px 12px}.title-copy{min-width:0}.kicker{display:flex;align-items:center;gap:7px;color:#e8c36b;font:700 .6rem var(--display);letter-spacing:.18em;text-transform:uppercase}.now-playing h2{margin:6px 0 0;font:700 clamp(1.35rem,2.8vw,2rem)/1.12 var(--display);letter-spacing:-.045em;overflow-wrap:anywhere}.now-playing p{margin:7px 0 0;color:var(--muted);font-size:.76rem;overflow-wrap:anywhere}.control-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 0 17px;border-bottom:1px solid var(--line)}.control-bar .btn{min-height:36px}.control-spacer{flex:1}
.playlist{display:flex;flex-direction:column;min-width:0;min-height:0;border-left:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(0,0,0,.12))}.playlist-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:21px 18px 15px;background:rgba(15,14,19,.93);border-bottom:1px solid rgba(255,255,255,.055);backdrop-filter:blur(14px)}.playlist-heading{min-width:0}.playlist-head h2{margin:0;font:700 1.2rem/1.1 var(--display);letter-spacing:-.04em}.playlist-head p{margin:5px 0 0;color:var(--muted);font-size:.66rem}.playlist-head>span{flex:0 0 auto;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:rgba(255,255,255,.035);font:700 .62rem var(--display);color:#fff;white-space:nowrap}.playlist-list{display:flex;flex-direction:column;gap:8px;overflow:auto;padding:12px;max-height: min(820px,calc(100svh - 190px));scrollbar-width:thin;scrollbar-color:rgba(232,195,107,.45) transparent}.playlist-empty{margin:4px 2px 10px;padding:20px 14px;border:1px dashed rgba(255,255,255,.16);border-radius:12px;text-align:center;color:var(--muted);font-size:.75rem;line-height:1.65}.playlist-item{position:relative;width:100%;display:grid;grid-template-columns:minmax(90px,116px) minmax(0,1fr);align-items:center;gap:11px;padding:8px;text-align:left;border:1px solid transparent;border-radius:11px;background:rgba(255,255,255,.028);color:var(--text);cursor:pointer;transition:background .18s ease,border-color .18s ease,transform .18s ease}.playlist-item:hover{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.06)}.playlist-item.active{border-color:rgba(232,195,107,.58);background:linear-gradient(100deg,rgba(232,195,107,.16),rgba(255,255,255,.025));box-shadow:inset 3px 0 var(--gold)}.thumb{position:relative;display:grid;place-items:center;min-width:0;aspect-ratio:16/9;border:1px solid rgba(255,255,255,.12);border-radius:7px;overflow:hidden;background:radial-gradient(circle at 30% 20%,#41313a,#111116 72%);color:#fff}.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .3s ease}.playlist-item:hover .thumb img{transform:scale(1.045)}.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(7,7,10,.03),rgba(7,7,10,.38) 65%,rgba(7,7,10,.68));pointer-events:none}.thumb-play{position:relative;z-index:1;display:grid;place-items:center;width:29px;height:29px;border:1px solid rgba(255,255,255,.42);border-radius:50%;background:rgba(8,8,11,.65);backdrop-filter:blur(5px);font-size:.75rem;box-shadow:0 3px 12px rgba(0,0,0,.25)}.active .thumb-play{border-color:var(--gold);background:var(--gold);box-shadow:0 5px 18px -8px var(--gold)}.item-copy{min-width:0;align-self:center}.item-copy strong{display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;font:700 .77rem/1.35 var(--sans);overflow-wrap:anywhere}.item-copy small{display:block;overflow:hidden;margin-top:6px;color:var(--muted);font-size:.63rem;white-space:nowrap;text-overflow:ellipsis}.item-type{display:inline-flex;align-items:center;gap:5px;margin-top:6px;color:#e4e0e5;font-size:.57rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.item-type:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold)}
.status{display:flex;align-items:center;gap:8px;min-height:39px;padding:10px clamp(13px,2vw,22px);border-top:1px solid var(--line);background:rgba(0,0,0,.16);color:#aaa6b0;font-size:.66rem;line-height:1.45}.status:before{content:"";flex:0 0 6px;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px rgba(232,195,107,.75)}.status[data-kind="error"]:before{background:#ff7278;box-shadow:0 0 10px #ff3943}.status[data-kind="success"]:before{background:#7ce3a1;box-shadow:0 0 10px rgba(124,227,161,.45)}
@media(min-width:1200px){.playlist-list{padding:14px;gap:9px}.playlist-item{grid-template-columns:118px minmax(0,1fr);padding:9px}.playlist-list{max-height:calc(100svh - 185px)}}
@media(max-width:900px){body{padding:9px}.player-grid{grid-template-columns:minmax(0,1fr)}.playlist{border-left:0;border-top:1px solid var(--line)}.playlist-head{padding:17px 16px 13px}.playlist-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-height:400px}.playlist-item{grid-template-columns:minmax(85px,38%) minmax(0,1fr)}}
@media(max-width:560px){body{padding:0;background:#08070c}.player-app{border-radius:0;border-left:0;border-right:0;min-height:100svh}.player-top{align-items:center;flex-direction:row;gap:13px;padding:13px 13px 12px}.brand-mark{width:38px;height:38px;flex-basis:38px;border-radius:10px}.brand strong{font-size:.78rem}.brand small{font-size:.66rem}.stage{padding:11px 10px 13px}.section-eyebrow{margin-bottom:9px}.media-shell{border-radius:10px;max-height:72svh;min-height:190px}.now-playing{padding:13px 2px 10px;gap:10px}.now-playing h2{font-size:1.43rem}.now-playing p{font-size:.72rem}.control-bar{gap:7px;padding:9px 0 13px}.control-bar .btn{min-height:35px;padding:7px 9px;font-size:.61rem}.control-spacer{display:none}.playlist-head{padding:15px 13px 11px}.playlist-list{display:flex;gap:8px;padding:10px;max-height:380px}.playlist-item{grid-template-columns:104px minmax(0,1fr);padding:8px}.thumb-play{width:26px;height:26px}.item-copy strong{font-size:.76rem}.status{padding:10px 13px}}
@media(max-width:360px){.control-bar .btn{padding:7px;font-size:.58rem}.playlist-item{grid-template-columns:88px minmax(0,1fr)}}
@media(hover:none){.btn:hover,.playlist-item:hover{transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.media-shell:fullscreen{width:100vw;height:100vh;max-height:none;min-height:0;aspect-ratio:auto;border:0;border-radius:0;background:#000}.media-shell:fullscreen iframe,.media-shell:fullscreen video,.media-shell:fullscreen>img{width:100%;height:100%;object-fit:contain}.media-shell:-webkit-full-screen{width:100vw;height:100vh;max-height:none;aspect-ratio:auto;border:0;border-radius:0;background:#000}

.btn{border-color:rgba(232,195,107,.22);background:rgba(232,195,107,.045)}
.btn:hover{border-color:rgba(232,195,107,.55);background:rgba(232,195,107,.105)}
.brand-mark{background:linear-gradient(145deg,rgba(252,231,184,.24),rgba(108,75,30,.18));border:1px solid rgba(232,195,107,.5);box-shadow:0 8px 28px -13px rgba(232,195,107,.65);color:var(--gold-bright)}
.brand strong{font:700 .94rem var(--display);letter-spacing:.12em}
.brand small{letter-spacing:.12em;text-transform:uppercase;font-size:.62rem}
.empty{background:radial-gradient(ellipse at 50% 35%,rgba(232,195,107,.15),transparent 48%),linear-gradient(145deg,#1b1721,#08070c 70%)}
.empty-icon{border-color:rgba(232,195,107,.42);background:linear-gradient(145deg,rgba(232,195,107,.23),rgba(232,195,107,.045));color:var(--gold-bright);box-shadow:0 0 34px -15px rgba(232,195,107,.8)}
.empty h1,.playlist-head h2,.now-playing h2{font-family:var(--serif);letter-spacing:0;font-weight:700}
.now-playing h2{font-size:clamp(1.65rem,3vw,2.45rem)}
.kicker{color:var(--gold-bright)}
.section-eyebrow{color:#ead9ae}
.media-shell{border-color:rgba(232,195,107,.25);box-shadow:0 24px 70px -35px #000,0 0 0 1px rgba(232,195,107,.04),0 0 36px -28px rgba(232,195,107,.5)}
.playlist-head{background:rgba(16,13,20,.94);border-bottom-color:rgba(232,195,107,.16)}
.playlist-item.active{border-color:rgba(232,195,107,.58);background:linear-gradient(100deg,rgba(232,195,107,.13),rgba(255,255,255,.02));box-shadow:inset 3px 0 var(--gold)}
.thumb{border-color:rgba(232,195,107,.2);background:radial-gradient(circle at 30% 20%,#3a3020,#111016 72%)}
.thumb-play{border-color:rgba(252,231,184,.5);color:var(--gold-bright)}
.active .thumb-play{border-color:var(--gold);background:var(--gold);color:#171108;box-shadow:0 5px 18px -8px rgba(232,195,107,.8)}
.item-type:before{background:var(--gold)}
.status:before{background:var(--gold);box-shadow:0 0 10px rgba(232,195,107,.7)}
.status[data-kind="success"]:before{background:#8fd6a8;box-shadow:0 0 10px rgba(143,214,168,.45)}
.btn.primary{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#171108;box-shadow:0 6px 18px -13px var(--gold)}
.btn.primary:hover{background:linear-gradient(180deg,#fff1c8,#e0b65c)}
.btn.active{border-color:var(--gold-line);background:rgba(232,195,107,.12);color:var(--gold-bright)}
.playlist-list{scrollbar-color:rgba(232,195,107,.42) transparent}
.video-skin{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;background:linear-gradient(180deg,rgba(5,4,9,.72),transparent 24%,transparent 58%,rgba(5,4,9,.9));opacity:1;transition:opacity .22s ease}
.video-skin[hidden]{display:none!important}
.skin-top{display:flex;align-items:center;gap:9px;padding:clamp(10px,2vw,20px);pointer-events:auto;transition:opacity .2s ease}
.skin-brand{display:flex;align-items:center;gap:8px;min-width:0;color:#fce7b8;font:700 .61rem var(--display);letter-spacing:.15em;text-transform:uppercase;text-shadow:0 2px 8px #000}
.skin-brand-mark{display:grid;place-items:center;width:27px;height:27px;flex:0 0 27px;border:1px solid rgba(232,195,107,.55);border-radius:8px;background:rgba(8,7,12,.72);color:var(--gold-bright)}
.skin-title{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#f2ede2;font-size:.76rem;font-weight:600;text-shadow:0 2px 8px #000}
.skin-spacer{flex:1}
.skin-icon{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 9px;border:1px solid rgba(252,231,184,.26);border-radius:9px;background:rgba(8,7,12,.66);backdrop-filter:blur(8px);color:#fff2ce;font:700 .8rem var(--display);cursor:pointer;pointer-events:auto;transition:background .18s,border-color .18s,transform .18s}
.skin-icon:hover{border-color:var(--gold);background:rgba(65,49,20,.8);transform:translateY(-1px)}
.skin-center-play{position:absolute;left:50%;top:50%;display:grid;place-items:center;width:clamp(55px,8vw,78px);height:clamp(55px,8vw,78px);padding-left:4px;transform:translate(-50%,-50%);border:1px solid rgba(252,231,184,.8);border-radius:50%;background:linear-gradient(145deg,rgba(252,231,184,.96),rgba(199,148,56,.96));color:#171108;font-size:1.3rem;box-shadow:0 0 0 8px rgba(232,195,107,.12),0 12px 45px rgba(0,0,0,.5);pointer-events:auto;cursor:pointer;transition:opacity .2s,transform .2s}
.skin-center-play:hover{transform:translate(-50%,-50%) scale(1.06)}
.video-skin.is-playing .skin-center-play{opacity:0;pointer-events:none}
.video-skin.controls-hidden .skin-top,.video-skin.controls-hidden .skin-bottom{opacity:0;pointer-events:none}
.video-skin.controls-hidden.is-playing .skin-center-play{opacity:0}
.skin-bottom{padding:0 clamp(10px,2vw,20px) clamp(10px,2vw,18px);pointer-events:auto;transition:opacity .2s ease}
.skin-seek{display:block;width:100%;height:4px;margin:0 0 10px;appearance:none;border-radius:20px;outline:none;background:linear-gradient(90deg,var(--gold) 0%,rgba(255,255,255,.28) 0%);cursor:pointer;accent-color:var(--gold)}
.skin-seek::-webkit-slider-thumb,.skin-volume::-webkit-slider-thumb{appearance:none;width:11px;height:11px;border:2px solid #fff2ce;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(232,195,107,.16)}
.skin-seek::-moz-range-thumb,.skin-volume::-moz-range-thumb{width:9px;height:9px;border:2px solid #fff2ce;border-radius:50%;background:var(--gold)}
.skin-controls{display:flex;align-items:center;gap:8px;color:#f1e7d3;font:600 .68rem var(--display);font-variant-numeric:tabular-nums;text-shadow:0 2px 8px #000}
.skin-controls .skin-icon{min-width:32px;height:32px}
.skin-volume{width:clamp(55px,9vw,92px);height:4px;accent-color:var(--gold);cursor:pointer}
.skin-grow{flex:1}
@media(max-width:560px){.skin-top{padding:10px}.skin-bottom{padding:0 10px 11px}.skin-controls{gap:6px;font-size:.61rem}.skin-controls .skin-icon{min-width:29px;height:29px;padding:0 7px}.skin-volume{width:48px}.skin-brand{font-size:.53rem;letter-spacing:.1em}.skin-title{font-size:.65rem}}
@media(hover:none){.video-skin.controls-hidden .skin-top,.video-skin.controls-hidden .skin-bottom{opacity:1;pointer-events:auto}}
</style>

<body>
<main class="player-app" aria-label="Elite photo and video player">
  <header class="player-top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">▶</span>
      <div class="brand-copy"><strong>Photo &amp; Video Player</strong><small id="playerCount">MEDIA LIBRARY</small></div>
    </div>
  </header>

  <div class="player-grid">
    <section class="stage" aria-label="Media player">
      <div class="section-eyebrow"><span class="live-dot" aria-hidden="true"></span><span id="stageLabel">Featured media</span></div>
      <div class="media-shell" id="mediaShell" data-fit="contain">
        <div class="empty" id="emptyState">
          <div class="empty-inner"><div class="empty-icon" aria-hidden="true">✦</div><h1>Your media, in focus.</h1><p>Select a photo or video to begin.</p></div>
        </div>
        <iframe id="videoFrame" title="Embedded video player" allow="autoplay; accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" hidden></iframe>
        <video id="directVideo" playsinline webkit-playsinline preload="metadata" hidden></video>
        <div class="video-skin" id="videoSkin" hidden>
          <div class="skin-top"><span class="skin-brand"><span class="skin-brand-mark">✦</span> ELITE PLAYER</span><span class="skin-title" id="skinTitle"></span><span class="skin-spacer"></span><button class="skin-icon" id="skinTopFullscreen" type="button" aria-label="Toggle fullscreen" title="Fullscreen">⛶</button></div>
          <button class="skin-center-play" id="skinCenterPlay" type="button" aria-label="Play video">▶</button>
          <div class="skin-bottom"><input class="skin-seek" id="skinSeek" type="range" min="0" max="1000" value="0" aria-label="Seek video"><div class="skin-controls"><button class="skin-icon" id="skinPlay" type="button" aria-label="Play or pause">▶</button><span id="skinCurrent">0:00</span><span>/</span><span id="skinDuration">0:00</span><span class="skin-grow"></span><button class="skin-icon" id="skinMute" type="button" aria-label="Mute or unmute">Muted</button><input class="skin-volume" id="skinVolume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volume"><button class="skin-icon" id="skinPip" type="button" title="Picture in picture" aria-label="Picture in picture">PiP</button><button class="skin-icon" id="skinFullscreen" type="button" aria-label="Fullscreen" title="Fullscreen">⛶</button></div></div>
        </div>
        <img id="photoFrame" alt="Selected media" decoding="async" hidden />
        <div class="media-shade" aria-hidden="true"></div>
      </div>

      <div class="now-playing">
        <div class="title-copy"><span class="kicker" id="mediaKicker">NOW SHOWING</span><h2 id="nowTitle">No media selected</h2><p id="nowMeta">Your selected photo or video will appear here.</p></div>
      </div>

      <div class="control-bar" aria-label="Player controls">
        <button class="btn" id="prevBtn" type="button" title="Previous media" disabled>◀ Prev</button>
        <button class="btn primary" id="nextBtn" type="button" title="Next media" disabled>Next ▶</button>
        <button class="btn active" id="autoNextBtn" type="button" aria-pressed="true" title="Automatically play the next item">Auto-next: On</button>
        <span class="control-spacer"></span>
        <button class="btn" id="fitBtn" type="button" title="Switch between fit and fill">Fit: Contain</button>
        <button class="btn" id="fullscreenBtn" type="button" title="Fullscreen">⛶ Fullscreen</button>
      </div>
    </section>

    <aside class="playlist" aria-label="Photo and video playlist">
      <div class="playlist-head"><div class="playlist-heading"><h2>Watchlist</h2><p>Pick a moment to play next</p></div><span id="playlistCount">0 items</span></div>
      <div class="playlist-list" id="playlistList" role="list"></div>
    </aside>
  </div>
  <div class="status" id="status" role="status" aria-live="polite">Ready to play.</div>
</main>

<script>
window.__TEAM_ELITE_MEDIA_READY=(async()=>{
  const candidates=[
    new URL('/media-data.js',location.origin).href,
    new URL('../media-data.js',location.href).href,
    new URL('./media-data.js',location.href).href
  ];
  for(const src of [...new Set(candidates)]){
    try{
      await new Promise((resolve,reject)=>{
        const script=document.createElement('script');
        script.src=src;
        script.onload=resolve;
        script.onerror=()=>{script.remove();reject(new Error('Media data load failed'));};
        document.head.appendChild(script);
      });
      if(window.TEAM_ELITE_MEDIA&&(Array.isArray(window.TEAM_ELITE_MEDIA.photos)||Array.isArray(window.TEAM_ELITE_MEDIA.videos)))return true;
    }catch(_){ }
  }
  return false;
})();
</script>
<script>
(async()=>{
  'use strict';
  const mediaDataLoaded=await window.__TEAM_ELITE_MEDIA_READY;

  const photoSource=Array.isArray(window.TEAM_ELITE_MEDIA?.photos)?window.TEAM_ELITE_MEDIA.photos:[];
  const videoSource=Array.isArray(window.TEAM_ELITE_MEDIA?.videos)?window.TEAM_ELITE_MEDIA.videos:[];
  const configured=[...photoSource.map(item=>normalize(item,'photo')),...videoSource.map(item=>normalize(item,'video'))].filter(Boolean);
  const PHOTO_DURATION=6500;
  let playlist=[...configured],activeIndex=-1,photoTimer=0,playbackToken=0,lastAdvanceAt=0,autoNext=true,fitMode='contain',thumbJobs=new Map(),skinTimer=0,seeking=false;

  function mediaInfo(raw,forced){
    try{
      const u=new URL(String(raw).trim(),location.href);
      if(!['http:','https:'].includes(u.protocol))return null;
      const host=u.hostname.toLowerCase().replace(/^www\./,''),path=u.pathname.toLowerCase();
      let id='';
      if(host==='youtu.be')id=u.pathname.split('/').filter(Boolean)[0]||'';
      if(['youtube.com','m.youtube.com','music.youtube.com','youtube-nocookie.com'].includes(host)){
        id=u.searchParams.get('v')||'';
        if(!id){const match=u.pathname.match(/\/(?:shorts|embed|live|v)\/([^/?]+)/i);id=match?.[1]||'';}
      }
      if(id&&/^[A-Za-z0-9_-]{6,}$/.test(id))return{type:'video',provider:'YouTube',embed:`https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&mute=1&rel=0&modestbranding=1&playsinline=1&enablejsapi=1&origin=${encodeURIComponent(location.origin)}`,thumb:`https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`,videoId:id};

        const match=u.pathname.match(/(?:video\/)?(\d+)/);

      if(videoExt)return{type:'video',provider:'Video',src:u.href};

    }catch(_){return null;}
  }

  function normalize(value,forcedType){

  }
  function render(){
    if(thumbObserver)thumbObserver.disconnect();

    if(!playlist.length){const e=document.createElement('div');e.className='playlist-empty';e.textContent='No media available.';listEl.appendChild(e);return;}
    playlist.forEach((item,index)=>{
      const b=document.createElement('button');b.type='button';b.className='playlist-item'+(index===activeIndex?' active':'');b.setAttribute('role','listitem');b.setAttribute('aria-pressed',String(index===activeIndex));b.setAttribute('aria-label',`Play ${item.title}`);
      b.appendChild(makeThumbnail(item));
      const copy=document.createElement('span');copy.className='item-copy';const h=document.createElement('strong');h.textContent=item.title;const m=document.createElement('small');m.textContent=item.meta;const type=document.createElement('span');type.className='item-type';type.textContent=item.info.type==='photo'?'Photo':'Video';copy.append(h,m,type);b.appendChild(copy);b.addEventListener('click',()=>select(index,true));listEl.appendChild(b);
      if(item.info.type==='video'&&!item.info.thumb&&!item.thumbSrc&&item.info.src){const thumb=b.querySelector('.thumb');thumb.__mediaItem=item;if(thumbObserver)thumbObserver.observe(thumb);else if(index<3)requestVideoThumbnail(item,thumb);}
    });
  }
  function clearMedia(){
    clearTimeout(photoTimer);photoTimer=0;clearTimeout(skinTimer);skinTimer=0;videoFrame.onload=null;videoFrame.src='';
    directVideo.pause();directVideo.removeAttribute('src');directVideo.load();photoFrame.onload=null;photoFrame.onerror=null;photoFrame.removeAttribute('src');
    videoFrame.hidden=true;directVideo.hidden=true;photoFrame.hidden=true;videoSkin.hidden=true;videoSkin.classList.remove('is-playing','controls-hidden');empty.hidden=false;shell.style.aspectRatio='16 / 9';
  }
  function moveTo(index,play=true){if(!playlist.length)return;const next=(index+playlist.length)%playlist.length;select(next,play);}
  function advance(){if(!autoNext||!playlist.length)return;const now=Date.now();if(now-lastAdvanceAt<850)return;lastAdvanceAt=now;moveTo(activeIndex+1,true);}
  function startPhotoTimer(token){clearTimeout(photoTimer);if(!autoNext)return;photoTimer=setTimeout(()=>{if(token===playbackToken&&activeIndex>=0)advance();},PHOTO_DURATION);}
  function updateAutoButton(){autoNextBtn.classList.toggle('active',autoNext);autoNextBtn.setAttribute('aria-pressed',String(autoNext));autoNextBtn.textContent=`Auto-next: ${autoNext?'On':'Off'}`;}
  function setAspect(width,height){if(!width||!height)return;const ratio=Math.min(1.9,Math.max(.62,width/height));shell.style.aspectRatio=String(ratio);}
  function registerEmbedEvents(info,token){
    if(token!==playbackToken||!videoFrame.contentWindow)return;
    if(info.provider==='YouTube'){
      const target='https://www.youtube.com';
      videoFrame.contentWindow.postMessage(JSON.stringify({event:'listening',id:'eliteVideoFrame',channel:'elite-media-player'}),target);
      videoFrame.contentWindow.postMessage(JSON.stringify({event:'command',func:'addEventListener',args:['onStateChange'],id:'eliteVideoFrame',channel:'elite-media-player'}),target);
    }else if(info.provider==='Vimeo')videoFrame.contentWindow.postMessage(JSON.stringify({method:'addEventListener',value:'finish'}),'https://player.vimeo.com');
  }

    const item=playlist[activeIndex];if(!item||!item.info.embed||event.source!==videoFrame.contentWindow)return;
    if(item.info.provider==='YouTube'&&event.origin!=='https://www.youtube.com'&&event.origin!=='https://www.youtube-nocookie.com')return;

  }

    activeIndex=index;playbackToken++;const token=playbackToken;clearMedia();const info=item.info;
    empty.hidden=true;titleEl.textContent=item.title;metaEl.textContent=item.meta;kickerEl.textContent=info.type==='photo'?'NOW SHOWING':'NOW PLAYING';stageLabel.textContent=info.type==='photo'?'Featured photo':'Featured video';

      directVideo.hidden=false;directVideo.controls=false;directVideo.muted=true;directVideo.defaultMuted=true;directVideo.volume=Number(skinVolume.value)||0.8;directVideo.playsInline=true;directVideo.src=info.src||item.url;videoSkin.hidden=false;skinTitle.textContent=item.title;skinSeek.value='0';skinCurrent.textContent='0:00';skinDuration.textContent='0:00';skinMute.textContent='Muted';skinPip.disabled=!(document.pictureInPictureEnabled&&directVideo.requestPictureInPicture);

      let driveFallbackUsed=false;
      directVideo.onerror=()=>{
        if(token!==playbackToken)return;
        if(info.provider==='Google Drive'&&info.embed&&!driveFallbackUsed){
          driveFallbackUsed=true;directVideo.pause();directVideo.removeAttribute('src');directVideo.load();directVideo.hidden=true;videoSkin.hidden=true;videoFrame.hidden=false;videoFrame.title=item.title;videoFrame.onload=()=>setTimeout(()=>registerEmbedEvents(info,token),250);videoFrame.src=info.embed;setStatus('Opening Google Drive player…');return;

    }

  }


  function formatTime(value){
    if(!Number.isFinite(value)||value<0)return '0:00';
    const seconds=Math.floor(value),minutes=Math.floor(seconds/60),remaining=String(seconds%60).padStart(2,'0');
    if(minutes>=60)return `${Math.floor(minutes/60)}:${String(minutes%60).padStart(2,'0')}:${remaining}`;
    return `${minutes}:${remaining}`;
  }
  function updateSeekPaint(){
    const value=Number(skinSeek.value)||0;
    skinSeek.style.background=`linear-gradient(90deg,var(--gold) ${value/10}%,rgba(255,255,255,.28) ${value/10}%)`;
  }
  function syncVideoControls(){
    if(directVideo.hidden)return;
    const duration=directVideo.duration,current=directVideo.currentTime||0;
    skinCurrent.textContent=formatTime(current);skinDuration.textContent=formatTime(duration);
    if(!seeking&&Number.isFinite(duration)&&duration>0)skinSeek.value=String(Math.round(current/duration*1000));
    skinPlay.textContent=directVideo.paused?'▶':'Ⅱ';skinPlay.setAttribute('aria-label',directVideo.paused?'Play video':'Pause video');
    skinCenterPlay.textContent=directVideo.paused?'▶':'Ⅱ';skinCenterPlay.setAttribute('aria-label',directVideo.paused?'Play video':'Pause video');
    skinMute.textContent=directVideo.muted||directVideo.volume===0?'Muted':'Sound';

    updateSeekPaint();
  }
  function togglePlayback(){
    if(directVideo.hidden)return;

    else directVideo.pause();
    revealSkinControls();
  }
  function toggleMute(){
    if(directVideo.hidden)return;
    directVideo.muted=!directVideo.muted;
    if(!directVideo.muted&&directVideo.volume===0)directVideo.volume=Number(skinVolume.value)||0.8;
    if(!directVideo.muted){const promise=directVideo.play();if(promise&&promise.catch)promise.catch(()=>{});}
    syncVideoControls();
  }
  function revealSkinControls(){
    if(directVideo.hidden)return;
    videoSkin.classList.remove('controls-hidden');clearTimeout(skinTimer);
    if(!directVideo.paused)skinTimer=setTimeout(()=>videoSkin.classList.add('controls-hidden'),3600);
  }
  async function toggleFullscreen(){
    try{
      if(document.fullscreenElement||document.webkitFullscreenElement){if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();}

  shell.addEventListener('pointermove',()=>{if(!directVideo.hidden)revealSkinControls();});
  shell.addEventListener('pointerdown',()=>{if(!directVideo.hidden)revealSkinControls();});

  directVideo.addEventListener('ended',()=>{if(autoNext)advance();else setStatus('Video finished. Auto-next is off.');});
  directVideo.addEventListener('play',()=>{if(!directVideo.hidden)setStatus('Video is playing.','success');});
  directVideo.addEventListener('waiting',()=>{if(!directVideo.hidden)setStatus('Buffering video…');});
  directVideo.addEventListener('error',()=>{if(!directVideo.hidden&&directVideo.currentSrc)setStatus('Video playback error. Check the source URL and permissions.','error');});

  fitBtn.addEventListener('click',()=>{fitMode=fitMode==='contain'?'cover':'contain';shell.dataset.fit=fitMode;shell.style.setProperty('--fit',fitMode);fitBtn.textContent=`Fit: ${fitMode==='contain'?'Contain':'Fill'}`;fitBtn.classList.toggle('active',fitMode==='cover');setStatus(fitMode==='contain'?'Media fits inside the player without cropping.':'Fill mode may crop the edges of photos or direct videos.');});

  updateAutoButton();shell.style.setProperty('--fit',fitMode);render();
  if(playlist.length)select(0,true);

})();
