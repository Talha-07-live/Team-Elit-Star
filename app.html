<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="color-scheme" content="dark" />
  <title>Elite Star App</title>

  <style>
    :root {
      --bg: #070b16;
      --card: rgba(18, 26, 52, .78);
      --border: rgba(255,255,255,.12);
      --text: #f5f7ff;
      --muted: #a8b2cf;
      --primary: #7c5cff;
      --secondary: #19d3ae;
      --danger: #ff6b81;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100svh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        max(20px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(124,92,255,.22),
          transparent 32%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(25,211,174,.14),
          transparent 30%
        ),
        var(--bg);

      overflow-x: hidden;
    }

    .shell {
      width: 100%;
      max-width: 560px;
      margin: auto;
    }

    .brand {
      width: 100%;
      text-align: center;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: clamp(10px, 2.5vw, 13px);
      line-height: 1.4;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .card {
      position: relative;
      width: 100%;
      overflow: hidden;

      padding: clamp(24px, 6vw, 44px);

      border: 1px solid var(--border);
      border-radius: clamp(20px, 5vw, 28px);

      background:
        linear-gradient(
          145deg,
          rgba(27,38,76,.86),
          var(--card)
        );

      box-shadow:
        0 25px 80px rgba(0,0,0,.36),
        inset 0 1px rgba(255,255,255,.06);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .card::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -80px;
      top: -80px;
      border-radius: 50%;
      background: rgba(124,92,255,.28);
      filter: blur(25px);
      pointer-events: none;
    }

    .icon {
      position: relative;

      width: clamp(64px, 17vw, 76px);
      height: clamp(64px, 17vw, 76px);

      display: grid;
      place-items: center;

      margin: 0 auto clamp(18px, 5vw, 22px);

      border-radius: clamp(18px, 5vw, 24px);

      background:
        linear-gradient(
          135deg,
          var(--primary),
          #a88dff
        );

      box-shadow:
        0 12px 30px rgba(124,92,255,.35);

      font-size: clamp(29px, 8vw, 35px);
      line-height: 1;
    }

    h1 {
      position: relative;

      margin: 0 0 10px;

      text-align: center;

      font-size: clamp(23px, 6vw, 34px);
      line-height: 1.18;

      overflow-wrap: anywhere;
    }

    .subtitle {
      position: relative;

      width: 100%;
      max-width: 410px;

      margin: 0 auto clamp(22px, 6vw, 28px);

      color: var(--muted);

      text-align: center;

      font-size: clamp(13px, 3.5vw, 16px);
      line-height: 1.65;

      overflow-wrap: anywhere;
    }

    .status {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      width: 100%;

      margin-bottom: 22px;

      color: var(--secondary);

      font-size: clamp(13px, 3.5vw, 15px);
      font-weight: 700;

      text-align: center;
    }

    .status span:last-child {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .dot {
      flex: 0 0 auto;

      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: currentColor;

      box-shadow:
        0 0 0 6px rgba(25,211,174,.12);

      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      50% {
        transform: scale(.65);
        opacity: .55;
      }
    }

    .progress-wrap {
      position: relative;

      width: 100%;
      height: 10px;

      overflow: hidden;

      border-radius: 100px;

      background: rgba(255,255,255,.1);
    }

    .progress {
      width: 0%;
      height: 100%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          var(--secondary)
        );

      transition: width .45s ease;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      width: 100%;

      margin-top: 11px;

      color: var(--muted);

      font-size: clamp(11px, 3vw, 13px);
      line-height: 1.4;
    }

    .meta span:first-child {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .count {
      flex: 0 0 auto;
      color: var(--text);
      font-weight: 800;
    }

    .actions {
      display: flex;

      width: 100%;

      gap: 12px;

      margin-top: clamp(22px, 6vw, 28px);
    }

    button,
    .button {
      appearance: none;
      -webkit-appearance: none;

      flex: 1 1 0;

      min-width: 0;
      min-height: 48px;

      border: 0;
      border-radius: 14px;

      padding: 13px 16px;

      font: inherit;
      font-size: clamp(13px, 3.5vw, 15px);
      font-weight: 800;

      cursor: pointer;

      text-align: center;
      text-decoration: none;

      transition:
        transform .2s ease,
        opacity .2s ease,
        box-shadow .2s ease;
    }

    button:hover,
    .button:hover {
      transform: translateY(-2px);
    }

    button:active,
    .button:active {
      transform: translateY(0) scale(.98);
    }

    button:focus-visible,
    .button:focus-visible {
      outline: 2px solid rgba(255,255,255,.7);
      outline-offset: 3px;
    }

    .primary {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          #6246df
        );

      box-shadow:
        0 10px 24px rgba(124,92,255,.28);
    }

    .secondary {
      color: var(--text);

      background: rgba(255,255,255,.09);

      border: 1px solid var(--border);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .destination {
      width: 100%;

      margin-top: 25px;
      padding: 13px 15px;

      border: 1px solid var(--border);
      border-radius: 12px;

      color: var(--muted);

      font-size: clamp(10px, 2.8vw, 12px);
      line-height: 1.5;

      overflow: hidden;
    }

    .destination strong {
      color: var(--text);
    }

    #destinationText {
      display: inline;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .footer {
      width: 100%;

      margin-top: 18px;

      color: #7782a3;

      font-size: clamp(10px, 2.7vw, 12px);
      line-height: 1.5;

      text-align: center;
    }

    .error {
      color: var(--danger) !important;
    }

    /* =========================
       SMALL MOBILE
       ========================= */

    @media (max-width: 430px) {

      body {
        padding:
          max(16px, env(safe-area-inset-top))
          max(12px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom))
          max(12px, env(safe-area-inset-left));
      }

      .brand {
        margin-bottom: 14px;
      }

      .card {
        padding: 24px 18px;
        border-radius: 22px;
      }

      .actions {
        flex-direction: column;
      }

      button,
      .button {
        width: 100%;
        flex: none;
      }

      .destination {
        margin-top: 20px;
      }
    }

    /* =========================
       VERY SMALL PHONES
       ========================= */

    @media (max-width: 360px) {

      body {
        padding-left: 10px;
        padding-right: 10px;
      }

      .card {
        padding: 20px 15px;
        border-radius: 20px;
      }

      .status {
        gap: 8px;
      }

      .meta {
        font-size: 11px;
      }

      .footer {
        margin-top: 14px;
      }
    }

    /* =========================
       LANDSCAPE MOBILE
       ========================= */

    @media (max-height: 560px) and (orientation: landscape) {

      body {
        display: block;
        padding-top: 14px;
        padding-bottom: 14px;
      }

      .shell {
        margin: 0 auto;
      }

      .brand {
        margin-bottom: 10px;
      }

      .card {
        padding: 20px 26px;
      }

      .icon {
        width: 52px;
        height: 52px;
        margin-bottom: 12px;
        border-radius: 16px;
        font-size: 25px;
      }

      h1 {
        font-size: 25px;
        margin-bottom: 6px;
      }

      .subtitle {
        margin-bottom: 14px;
        line-height: 1.45;
      }

      .status {
        margin-bottom: 14px;
      }

      .actions {
        margin-top: 18px;
      }

      .destination {
        margin-top: 15px;
      }

      .footer {
        margin-top: 10px;
      }
    }

    /* =========================
       TABLET / DESKTOP
       ========================= */

    @media (min-width: 768px) {

      .shell {
        max-width: 560px;
      }

      .card {
        padding: 42px;
      }
    }

    /* =========================
       REDUCE MOTION
       ========================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <main class="shell">

    <div class="brand">
      Secure download gateway
    </div>

    <section class="card" aria-live="polite">

      <div class="icon" id="icon">↓</div>

      <h1 id="title">
        Your download is ready
      </h1>

      <p class="subtitle" id="subtitle">
        You will be securely redirected to the destination page.
        Please wait a few seconds.
      </p>

      <div class="status" id="status">
        <span class="dot"></span>
        <span id="statusText">
          Verifying your link...
        </span>
      </div>

      <div class="progress-wrap">
        <div
          class="progress"
          id="progress">
        </div>
      </div>

      <div class="meta">
        <span id="progressText">
          Preparing download
        </span>

        <span
          class="count"
          id="count">
          03s
        </span>
      </div>

      <div class="actions">

        <button
          class="primary"
          id="continueBtn"
          disabled>
          Continue now
        </button>

        <button
          class="secondary"
          id="cancelBtn">
          Cancel
        </button>

      </div>

      <div class="destination">
        <strong>Destination:</strong>
        <span id="destinationText">
          https://example.com/download
        </span>
      </div>

    </section>

    <div class="footer">
      Your data is not being stored • SSL secured connection
    </div>

  </main>


  <script>

    // ==========================================
    // EASY CONFIGURATION
    // ==========================================

    const REDIRECT_URL =
      "https://av-f2l-bot.avbotz26.workers.dev/72017?hash=AgADFC";

    const COUNTDOWN_SECONDS = 3;

    const AUTO_REDIRECT = true;

    // ==========================================
    // CORE
    // ==========================================

    const $ = (id) =>
      document.getElementById(id);

    const state = {
      remaining: COUNTDOWN_SECONDS,
      cancelled: false,
      finished: false,
      timer: null,
      redirectTimer: null
    };


    // ==========================================
    // INITIAL UI
    // ==========================================

    $("destinationText").textContent =
      REDIRECT_URL;

    $("count").textContent =
      String(state.remaining).padStart(2, "0") + "s";


    // ==========================================
    // REDIRECT
    // ==========================================

    function goToDestination() {

      if (state.finished && state.cancelled) {
        // "Continue anyway" explicitly allows redirect
        state.cancelled = false;
      }

      if (state.cancelled) return;

      state.finished = true;

      clearTimeout(state.timer);
      clearTimeout(state.redirectTimer);

      $("statusText").textContent =
        "Redirecting now...";

      $("progressText").textContent =
        "Complete";

      $("progress").style.width =
        "100%";

      window.location.assign(REDIRECT_URL);
    }


    // ==========================================
    // FINISH COUNTDOWN
    // ==========================================

    function finish() {

      if (state.cancelled) return;

      state.finished = true;

      $("continueBtn").disabled = false;

      $("statusText").textContent =
        "Ready to continue";

      $("progressText").textContent =
        "Ready";

      $("count").textContent =
        "00s";

      $("progress").style.width =
        "100%";

      if (AUTO_REDIRECT) {

        state.redirectTimer =
          setTimeout(
            goToDestination,
            450
          );
      }
    }


    // ==========================================
    // COUNTDOWN
    // ==========================================

    function tick() {

      if (state.cancelled) return;

      const elapsed =
        COUNTDOWN_SECONDS -
        state.remaining;

      const percent =
        Math.min(
          100,
          Math.max(
            0,
            (elapsed / COUNTDOWN_SECONDS) * 100
          )
        );

      $("progress").style.width =
        percent + "%";


      if (state.remaining <= 0) {

        finish();
        return;
      }


      state.remaining -= 1;

      $("count").textContent =
        String(state.remaining)
          .padStart(2, "0") + "s";


      state.timer =
        setTimeout(
          tick,
          1000
        );
    }


    // ==========================================
    // CONTINUE
    // ==========================================

    $("continueBtn")
      .addEventListener(
        "click",
        goToDestination
      );


    // ==========================================
    // CANCEL
    // ==========================================

    $("cancelBtn")
      .addEventListener(
        "click",
        () => {

          state.cancelled = true;

          clearTimeout(state.timer);
          clearTimeout(state.redirectTimer);

          $("status")
            .classList
            .add("error");

          $("statusText").textContent =
            "Redirect cancelled";

          $("progressText").textContent =
            "Cancelled";

          $("icon").textContent =
            "×";

          $("progress").style.width =
            "0%";

          $("continueBtn").disabled =
            false;

          $("continueBtn").textContent =
            "Continue anyway";
        }
      );


    // ==========================================
    // START
    // ==========================================

    tick();

  </script>

</body>
</html>
